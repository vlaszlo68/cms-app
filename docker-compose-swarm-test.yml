version: "3.9"

services:

  cms-swarm-postgres:
    image: postgres:15

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_pw

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - cms-network

    deploy:
      replicas: 1

      restart_policy:
        condition: any

  cms-swarm-tomcat:
    image: cms-swarm-tomcat:latest

    ports:
      - "8081:8080"

    environment:
      DB_HOST: cms-swarm-postgres
      DB_PORT: 5432
      DB_NAME: cms_db
      DB_USER: cms_user
      DB_PASSWORD: cms_pw
      # Explicit cluster test mode: backend session state in PostgreSQL
      SESSION_STORE_MODE: "jdbc"
      SESSION_COOKIE_NAME: "CMS_SESSION_ID"
      SESSION_TIMEOUT_MINUTES: "30"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: "Lax"
      # Explicit cluster test mode: rate limiter state in PostgreSQL
      RATE_LIMITER_STORE_MODE: "jdbc"

    networks:
      - cms-network

    deploy:
      replicas: 1

      restart_policy:
        condition: any

      update_config:
        parallelism: 1
        delay: 30s

  cms-swarm-nginx:
    image: nginx:1.27

    ports:
      - "8083:80"

    volumes:
      - ./docker/nginx/nginx-swarm.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

    networks:
      - cms-network

    deploy:
      replicas: 2

      restart_policy:
        condition: any

      update_config:
        parallelism: 1
        delay: 10s

networks:

  cms-network:
    name: cms-swarm-network
    driver: overlay

volumes:

  postgres_data:
    external: true
    name: cms_postgres_data

  frontend_dist:
    external: true
    name: cms_frontend_dist
