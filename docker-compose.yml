version: "3.9"

services:
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    container_name: cms-postgres
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cms-network

  tomcat:
    build:
      context: .
      dockerfile: docker/tomcat/Dockerfile
    container_name: cms-tomcat
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cms_db
      DB_USER: cms_user
      DB_PASSWORD: cms_pw
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - cms-network

  frontend-build: 
    build: 
      context: ../frontend 
      dockerfile: docker/Dockerfile 
      
    container_name: cms-frontend-build 
        
    volumes: 
      - frontend_dist:/frontend-dist 
            
    command: > 
         sh -c " 
         npm install && 
         npm run build && 
         cp -r /app/dist/* /frontend-dist/ " 
        
    restart: "no" 
        
    networks: 
       - cms-network 
        
  nginx: 
    image: nginx:1.27 
        
    container_name: cms-nginx 
        
    depends_on: 
       - tomcat 
       - frontend-build 
        
    ports: 
      - "8083:80" 
        
    volumes: 
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro 
      - frontend_dist:/usr/share/nginx/html:ro 
        
    restart: unless-stopped 
        
    networks: 
      - cms-network

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    container_name: cms-jenkins
    ports:
      - "8082:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: cms_db
        DB_USER: cms_user
        DB_PASSWORD: cms_pw  
    restart: always
    networks:
      - cms-network

    group_add:
      - "987"

networks:
  cms-network:
    name: cms-network

volumes:
  postgres_data:
    name: cms_postgres_data
  jenkins_home:
    name: cms_jenkins_home
  frontend_dist:
    name: cms_frontend_dist
